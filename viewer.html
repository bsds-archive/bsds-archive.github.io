<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- The user-scalable=no above is left in as a small extra deterrent,
     but it isn't the real fix — mobile browsers largely ignore it for
     accessibility reasons, and desktop browsers never honored viewport
     zoom restrictions at all. The actual mechanism is in
     css/viewer.css (touch-action:none on .viewer-stage) plus
     js/app.js's _initTouchAndZoom(), which takes over touch scrolling,
     pinch-zoom, AND desktop Ctrl+scroll/trackpad-zoom entirely, funneling
     all of it into the same _setZoom() the +/- toolbar buttons use —
     since that code path never depended on native browser zoom, it
     scrolls correctly in both directions, unlike native pinch-then-pan
     which only ever managed vertical movement here, however the layout
     was arranged. -->
<title>Document · BSDS Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/viewer.css">
<link rel="stylesheet" href="css/responsive.css">
<!-- Applies a saved light/dark preference before first paint, so there's
     no flash of the wrong theme. Deliberately inline + tiny + synchronous. -->
<script>
  (function(){
    try {
      if (localStorage.getItem('bsds-viewer-theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) { /* private browsing, etc — safe to ignore, defaults to dark */ }
  })();
</script>
</head>
<body>

<!-- Header + toolbar + search bar are wrapped together and pinned with
     position:fixed (not sticky) so they're guaranteed to stay on screen
     no matter what — see _syncViewerHeaderHeight() in js/app.js, which
     measures this wrapper's real rendered height and pushes the PDF
     content down to match, so nothing ever sits underneath it. -->
<div class="viewer-fixed-head" id="viewerFixedHead">

  <header class="viewer-topbar">
    <a class="viewer-back" href="javascript:history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      Back
    </a>
    <div class="viewer-title" id="viewerTitle">Loading document…</div>
    <a class="btn btn-ghost" id="viewerDownload" href="#" style="padding:8px 16px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
      Download
    </a>
  </header>

  <div class="viewer-toolbar">
    <div class="vt-group">
      <button class="vt-btn" id="prevPage" aria-label="Previous page" title="Previous page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="vt-label">Page <span id="pageCurrent">1</span> / <span id="pageTotal">1</span></span>
      <button class="vt-btn" id="nextPage" aria-label="Next page" title="Next page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="vt-group">
      <button class="vt-btn" id="zoomOut" aria-label="Zoom out" title="Zoom out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
      </button>
      <span class="vt-label" id="zoomLabel">100%</span>
      <button class="vt-btn" id="zoomIn" aria-label="Zoom in" title="Zoom in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="vt-group">
      <button class="vt-btn" id="searchToggle" aria-label="Search this document" title="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <!-- hidden automatically by JS on browsers without Fullscreen API
           support (notably iOS Safari) rather than showing a dead button -->
      <button class="vt-btn" id="fullscreenToggle" aria-label="Toggle fullscreen"></button>
      <!-- icon filled in by _updateThemeToggleIcon() in js/app.js, so it
           always matches the current theme on load -->
      <button class="vt-btn" id="themeToggle" aria-label="Toggle light/dark theme"></button>
    </div>
  </div>

  <!-- In-document search — hidden until the magnifying-glass button above
       is tapped. Searches every page's text (see _runPdfSearch() in
       js/app.js), not just the ones currently rendered. -->
  <div class="search-bar" id="searchBar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="search" id="searchInput" placeholder="Search in this document…">
    <span class="search-bar-results" id="searchResults"></span>
    <button class="vt-btn" id="searchPrev" aria-label="Previous match" title="Previous match">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
    </button>
    <button class="vt-btn" id="searchNext" aria-label="Next match" title="Next match">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

</div>

<!-- The document itself: every page stacked vertically in one
     continuously-scrollable column (see initViewer() in js/app.js).
     Its top padding is set dynamically in JS to match the fixed
     header above, exactly — see _syncViewerHeaderHeight(). -->
<main class="viewer-stage" id="viewerStage">
  <div class="viewer-status" id="viewerStatus">
    <div class="spinner"></div>
    <span id="statusLabel">Loading document…</span>
  </div>
  <div id="pdfPages" class="pdf-pages" hidden></div>
</main>

<!-- Custom right-edge scrollbar — a real, always-visible drag-to-jump
     scrubber like Google Drive's PDF preview has. The browser's own
     native scrollbar is hidden on .viewer-stage in favor of this one,
     since native scrollbars are invisible-by-design on mobile and can't
     be styled consistently across browsers. See _initCustomScrollbar()
     in js/app.js. Hidden by default until the document has loaded and
     is tall enough to actually need scrolling. -->
<div class="viewer-scrollbar" id="viewerScrollbar" hidden>
  <div class="viewer-scrollbar-track">
    <div class="viewer-scrollbar-thumb" id="viewerScrollbarThumb"></div>
  </div>
  <div class="viewer-scrollbar-tooltip" id="viewerScrollbarTooltip"></div>
</div>

<!-- PDF.js — rendered entirely in-browser via <canvas>, so it looks and
     behaves the same on a phone as it does on a laptop, instead of relying
     on whatever PDF handling (or lack of it) the visitor's browser has
     built in. Both files below MUST stay on the exact same version. -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';
</script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => initViewer());
</script>

</body>
</html>
